autoTrigger:if self.isControlledByAI and numberOfUnitsInEnemyTeam(withTag='空军',withinRange=340,greaterThan=0) and self.customTimer(laterThanSeconds=2) or self.isControlledByAI and self.hasTakenDamage(withinSeconds=1) and self.customTimer(laterThanSeconds=2)
