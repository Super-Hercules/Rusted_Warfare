addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[hiddenAction_前进2]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if self.isControlledByAI and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=340,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=380,greaterThan=0) and not self.isAttacking and numberOfUnitsInEnemyTeam(withTag='空军',greaterThan=0)
