displayDescription:在浩瀚的宇宙中联邦曾发现过一艘对于当时的他们来说超乎想象的巨舰\n依据巨舰上的字迹，他们将其命名为“格里芬”，或者“宇宙馈赠”\n它的启用已经是天工都类计划中期，但是毫无疑问的是，破解它为昙彩之都的建成提供了直接动力\n尽管如此，我们仍未能完全破解这艘舰船的全部秘密\n护盾采用特殊充能机制，可以无限提供能量来增加护盾强度，支持单舰突入作战\n配备5门高射速机枪，提供近乎完美的火力覆盖，但对护盾效果不佳\n4门超压电磁聚能炮射速极快，击中后会击穿护盾并造成连锁闪电效果\n两门主炮使用大型聚能炮，发射可以破盾破甲的激光\n此外，人类联邦还为其配备了18艘高速舰载机与特殊的护盾发生器\n不幸的是，我们并不能解决它的能源泄露问题，这导致我们的仿制品必须持续供给能量\n‘破晓之光照亮前路，利刃的锋芒破开雾瘴！’\n设计师：奥托
