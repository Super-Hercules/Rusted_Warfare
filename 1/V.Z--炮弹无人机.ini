[core]

name:V.Z--炮弹无人机
displayText:V.Z--炮弹无人机
class:CustomUnitMetadata
price:1000
maxHp:250
selfRegenRate:0
buildSpeed:10s
mass:2500
showInEditor:true
availableInDemo:true
numBitsOnDeath:12
radius:12
isBio:false
fogOfWarSightRange:20
showOnMinimap:true
hideScorchMark:true
canNotBeGivenOrdersByPlayer:true
[hiddenAction_升级]
autoTrigger:if self.globalTeamTags(includes='升级T2') and not self.hasFlag(id=0)
setUnitStats:maxHp=500,shootDamageMultiplier=2
addResources:setFlag=0
[hiddenAction_升级1]
autoTrigger:if self.globalTeamTags(includes='升级T3') and not self.hasFlag(id=1)
setUnitStats:maxHp=750,shootDamageMultiplier=1.5
addResources:setFlag=1
[hiddenAction_升级2]
autoTrigger:if self.globalTeamTags(includes='升级T4') and not self.hasFlag(id=2)
setUnitStats:maxHp=1000,shootDamageMultiplier=2
addResources:setFlag=2
[hiddenAction_升级3]
autoTrigger:if self.globalTeamTags(includes='升级T5') and not self.hasFlag(id=3)
setUnitStats:maxHp=1500,shootDamageMultiplier=2
addResources:setFlag=3
[hiddenAction_升级4]
autoTrigger:if self.globalTeamTags(includes='升级T6') and not self.hasFlag(id=4)
setUnitStats:maxHp=2000,shootDamageMultiplier=3
addResources:setFlag=4
[hiddenAction_前进]
clearAllWaypoints:true
addWaypoint_type:move
autoTrigger:if numberOfUnitsInEnemyTeam(withTag='单位',withinRange=160,greaterThan=0) and self.customTimer(laterThanSeconds=2) or self.hasTakenDamage(withinSeconds=1) and self.customTimer(laterThanSeconds=2)
resetCustomTimer:true
addWaypoint_position_randomOffsetFromSelf:5000,5000
addWaypoint_position_offsetFromSelf:0,0
addWaypoint_target_nearestUnit_maxRange:9999000
[hiddenAction_前进1]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if numberOfUnitsInEnemyTeam(withTag='单位',withinRange=310,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=175,greaterThan=0)
addWaypoint_target_nearestUnit_tagged:单位
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[hiddenAction_前进2]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=300,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=180,greaterThan=0) and not self.isAttacking and numberOfUnitsInEnemyTeam(withTag='单位',greaterThan=0)
addWaypoint_target_nearestUnit_tagged:单位
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
