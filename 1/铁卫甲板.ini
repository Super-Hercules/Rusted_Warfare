[hiddenAction_建造舰载机]
autoTrigger: if self.tags(includes='起飞') and numberOfUnitsInTeam(lessThan=42,withTag='铁卫')
[action_舰载机]
isLocked: if numberOfUnitsInTeam(greaterThan=41,withTag='铁卫',factoryQueue=true)
produceUnits: 铁卫*6
autoTrigger: if numberOfUnitsInTeam(lessThan=42,withTag='铁卫',factoryQueue=true)
[hiddenAction_自动重建舰载机]
autoTrigger: if numberOfUnitsInTeam(lessThan=42,withTag='铁卫',factoryQueue=true) and not self.hasFlag(id=0) and not self.hasFlag(id=1)
[hiddenAction_遇敌]
autoTrigger: if self.tags(includes='起飞') and numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyRemoveTags: 起飞
[hiddenAction_起飞]
autoTrigger: if not self.tags(includes='起飞') and not numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyAddTags: 起飞
