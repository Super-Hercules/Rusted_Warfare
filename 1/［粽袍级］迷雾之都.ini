displayDescription:[迷雾之都］是一种独特的实验型巡洋舰\n-［迷雾之都］搭载10门舰外重型天空纯能光束炮\n-搭载［幽光］光束炮\n-搭载［天工纯能］护盾（护盾每次单方面抵消伤害85)\n-属于空中单位\n-［所有的天空纯能装备无视所有护盾并对护盾造成十倍伤害和穿透装甲]\n[武器对于建筑的伤害衰减到了原来的0.8倍]\n[雾都]自身血量低于一万将会进入雾都,持续约11秒\n[粽与袍快速生产线]当受到攻击时便会快速生产粽与袍强化版，不过由于此粽与袍机体超载导致将会在一段时间后舰体爆裂\n［粽袍级］作为第一艘巡洋舰，以‘雾都’的诡异手段被划为巡洋舰的队列，［粽袍级］会在战场中散布大量的迷雾作战\n设计师:蜂后
