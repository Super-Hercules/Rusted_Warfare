[core]

name:T型工程舰
tags:T型工程舰
class:CustomUnitMetadata
displayDescription:T2级工程舰\n与其说是工程舰，更不如说是超级兵工厂？\n-可以建造采矿舰和一些大型机甲\n-内部有着一定的空间用于运输单位\n-仅配备一门双联装导弹炮\n不会显示在敌方的小地图上\n设计师:狂人萨尔
price:200000
maxHp:15000
maxShield:10000
mass:40000
shieldRegen:1
startShieldAtZero:true
techLevel:1
buildSpeed:45s
selfRegenRate:0.1
availableInDemo:true
radius:50
