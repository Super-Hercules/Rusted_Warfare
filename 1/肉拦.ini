[core]

name:肉拦
tags:厄瑞
price:2000
maxHp:700
selfRegenRate:0.5
mass:6000
armour:10
generation_credits:-20
buildSpeed:10s
radius:14
isBio:false
displayText:肉拦
displayDescription:厄瑞族群的空中防御，T2级\n这是个有意思的兵种，接受到来至遥远的信息所制造的兵种
[hiddenAction_指数]
autoTriggerOnEvent:destroyed
addResources:战争指数=0.33
requireConditional:if not self.globalTeamTags(includes='基因T3')
[hiddenAction_前进]
clearAllWaypoints:true
addWaypoint_type:move
autoTrigger:if self.isControlledByAI and numberOfUnitsInEnemyTeam(withTag='空军',withinRange=150,greaterThan=0) and self.customTimer(laterThanSeconds=2) or self.isControlledByAI and self.hasTakenDamage(withinSeconds=1) and self.customTimer(laterThanSeconds=2)
resetCustomTimer:true
addWaypoint_position_randomOffsetFromSelf:5000,5000
addWaypoint_position_offsetFromSelf:0,0
addWaypoint_target_nearestUnit_maxRange:9999000
[hiddenAction_前进1]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if self.isControlledByAI and numberOfUnitsInEnemyTeam(withTag='空军',withinRange=300,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=165,greaterThan=0)
addWaypoint_target_nearestUnit_tagged:空军
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[hiddenAction_前进2]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if self.isControlledByAI and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=300,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=170,greaterThan=0) and not self.isAttacking and numberOfUnitsInEnemyTeam(withTag='空军',greaterThan=0)
addWaypoint_target_nearestUnit_tagged:空军
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[resource_时间]
displayName:时间
displayNameShort:时间
[hiddenAction_倒计时]
autoTrigger:true
addResources:时间=0.1
