autoTriggerOnEvent:destroyed
requireConditional:if self.globalTeamTags(includes="养分回收II") and not self.globalTeamTags(includes="养分回收III")
isVisible:if self.globalTeamTags(includes="养分回收II") and not self.globalTeamTags(includes="养分回收III")
[action_养分回收III]
