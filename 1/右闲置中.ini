[core]

name:右闲置中
class:CustomUnitMetadata
price:5000
tags:闲置模块
showInEditor:false
maxHp:3000
selfRegenRate:3000
mass:90000
techLevel:1
buildSpeed:0.0002
radius:20
fogOfWarSightRange:5
transportSlotsNeeded:1
softCollisionOnAll:3
canNotBeDirectlyAttacked:true
isUnrepairableUnit:true
showOnMinimap:false
ignoreInUnitCapCalculation:true
isUnselectable:true
disableDeathOnZeroHp:true
[template_buildTurret]
text:建造
textAddUnitName:${section.convertTo}
descriptionAddFromUnit:${section.convertTo}
descriptionAddUnitStats:${section.convertTo}
[action_武器]
@copyFromSection:template_buildTurret
buildSpeed:1s
convertTo:武器模块(右)
price:6000
isLocked:if not self.globalTeamTags(includes='信息T2')
ai_isDisabled:true
[action_防御]
@copyFromSection:template_buildTurret
buildSpeed:1s
convertTo:防御模块(右)
price:4000
ai_isDisabled:true
[action_经济]
@copyFromSection:template_buildTurret
buildSpeed:1s
convertTo:经济模块(右)
price:8000
[action_特种]
@copyFromSection:template_buildTurret
buildSpeed:1s
convertTo:特种模块(右)
price:9000
isLocked:if not self.globalTeamTags(includes='信息T2')
ai_isDisabled:true
[graphics]
drawLayer:experimentals
total_frames:1
image:闲置中.png
imageScale:0.75
image_wreak:NONE
image_turret:NONE
image_shadow:AUTO
shadowOffsetX:3
shadowOffsetY:3
icon_zoomed_out_neverShow:true
[attack]
canAttack:false
canAttackFlyingUnits:true
canAttackLandUnits:true
canAttackUnderwaterUnits:false
turretSize:30
turretTurnSpeed:2
maxAttackRange:290
shootDelay:85
[movement]
movementType:OVER_CLIFF_WATER
moveSpeed:0
moveAccelerationSpeed:0
moveDecelerationSpeed:0
targetHeight:0
targetHeightDrift:0
reverseSpeedPercentage:1
maxTurnSpeed:0.6
turnAcceleration:0.2
moveSlidingMode:false
moveIgnoringBody:false
moveSlidingDir:45
slowDeathFall:true
[ai]
ai_upgradePriority:0.2