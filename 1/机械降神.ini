[core]

name:机械降神
maxHp:7000
maxShield:1000
startShieldAtZero:true
shieldRegen:0
mass:440
price:2000000
buildSpeed:80s
canNotBeGivenOrdersByPlayer:true
radius:20
tags:单位,机械降神,母体
displayDescription:T4级究极单位\n在联合远征军毁灭后，有人提出创造一种可以自我复制的微型机械用来抵挡可能会到来的战争\n在旧银河人类联邦的政权被推倒后，人类联邦的回响之炉组织成为新人类联邦的掌控者\n在回响之炉的工程师贰零拾月的改造后，名为机械降神的微型机械诞生了\n诸神以泥土创造人类，人类以机械建造诸神\n可用于分担伤害\n但非常惧怕有大范围高伤的单位\n设计者:贰零拾月
[hiddenAction_分裂重组1]
autoTrigger:if self.customTimer(laterThanSeconds=1.3)
spawnUnits:炮弹,闪电,激光
resetCustomTimer:true
[hiddenAction_重置]
autoTriggerOnEvent:created
resetCustomTimer:true
[graphics]
