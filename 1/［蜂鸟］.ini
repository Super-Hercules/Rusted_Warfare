displayDescription:-［晴空之都］搭载一门[万里晴空]主炮\n-搭载两门[赤阳]鱼雷发射炮\n-搭载［天工框架］:高额的护盾,150的厚重装甲\n-属于空中单位\n拥有[晴空之都]庇护，死亡后会变为晴空战旗，花费原价80%重返战场！\n-装载十架[烈阳]护盾溶解器\n[武器对于建筑的伤害衰减到了原来的0.2倍]\n[晴空之都]自身受到任意伤害，会恢复所有护盾且范围治疗敌人\n[蜂鸟]拥有极强的破盾能力，能瞬间蒸发一切护盾！\n[蜂鸟级]本是作为战列舰的形式制作，随着海巢的大型航母介入战场，大量的海巢载舰机装载护盾让战场随着对方一面倒，随后根据[蜂鸟级]本身的性质给他装备了大量范围腐蚀护盾的武器跟大量的支援武器用作航母空中火力网突破辅助使用\n设计师：蜂后
