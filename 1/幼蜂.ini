[core]

name:幼蜂
class:CustomUnitMetadata
maxHp:2000
displayDescription:T1级\n由联邦工程师贰零拾月提出的仿生项目的蜂型单位\n设计师:贰零拾月
mass:100
price:1500
radius:15
buildSpeed:7s
selfRegenRate:0.1
[hiddenAction_前进]
clearAllWaypoints:true
addWaypoint_type:move
autoTrigger:if self.isControlledByAI and numberOfUnitsInEnemyTeam(withTag='空军',withinRange=90,greaterThan=0) and self.customTimer(laterThanSeconds=2) or self.isControlledByAI and self.hasTakenDamage(withinSeconds=1) and self.customTimer(laterThanSeconds=2)
resetCustomTimer:true
addWaypoint_position_randomOffsetFromSelf:5000,5000
addWaypoint_position_offsetFromSelf:0,0
addWaypoint_target_nearestUnit_maxRange:9999000
[hiddenAction_前进1]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if self.isControlledByAI and numberOfUnitsInEnemyTeam(withTag='空军',withinRange=240,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=105,greaterThan=0)
addWaypoint_target_nearestUnit_tagged:空军
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[hiddenAction_前进2]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if self.isControlledByAI and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=240,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='空军',withinRange=110,greaterThan=0) and not self.isAttacking and numberOfUnitsInEnemyTeam(withTag='空军',greaterThan=0)
addWaypoint_target_nearestUnit_tagged:空军
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
