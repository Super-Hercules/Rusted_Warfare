displayDescription:T2级\n在厄瑞的教导下掌握了对特殊能量的使用\n使用能量击退1500范围内的敌方，并拦截抛射体
tags:厄之抵抗,飓风虫
class:CustomUnitMetadata
price:5000
maxHp:2600
mass:1200
techLevel:1
