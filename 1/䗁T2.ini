addResources:unsetFlag=31
isVisible:if self.hasFlag(id=31)
buildSpeed:0
alwaysSinglePress:true
displayType:action
pos:1
iconExtraImage:收起.png
[canBuild_1.1]
name:资源虫
pos:1.1
isLocked:if numberOfUnitsInTeam(greaterThan=199,withTag='资源虫',factoryQueue=true)
isLockedMessage:低级资源虫只能拥有200只
isVisible:if self.hasFlag(id=31) or self.isControlledByAI
[canBuild_1.2]
name:音波虫,音波飞虫
pos:1.2
isVisible:if self.hasFlag(id=31) or self.isControlledByAI
