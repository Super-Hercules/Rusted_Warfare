[core]
name:䗁T2
tags:䗁,厄之抵抗,基地
displayText:䗁T2
displayDescription:䗁之虫族的母虫\n进化后自身有了更强大的能力\n可喷射范围性溶解液，对护盾双倍伤害；可发射范围性音波，无视装甲和护盾
class:CustomUnitMetadata
price:0
maxHp:12000
disableAllUnitCollisions:true
mass:50000000
buildSpeed:30s
radius:20
