[core]
name:䗁T6
tags:䗁,厄之抵抗,物质抵抗,䗁T6,基地
displayText:䗁T6
displayDescription:䗁之虫族的母虫\n进化后自身有了更强大的能力，可跨水\n可喷射范围性溶解液，对护盾双倍伤害；可发射范围性音波，无视装甲和护盾；有了近战能力；发射3束可以穿透2次的能量光束,每次伤害会衰减，无视装甲，穿透护盾\n全身覆盖装甲，获得巨大的提升\n撕裂敌方，使其无法恢复\n可开辟1个空间传送场，并将内部单位传送至5000范围之内的任何区域\n对部分效果有强大的抗性\nT5，T6后子虫可增长生命，调整状态后效果消失\n处于䗁1000范围内的子虫将受到庇护，免疫万物归一效果
class:CustomUnitMetadata
price:0
fogOfWarSightRange:1000
maxHp:750000
mass:50000000
buildSpeed:30s
radius:100
disableAllUnitCollisions:true
isBio:true
isBug:true
selfRegenRate:25
generation_credits:10000
armour:1000
armourMinDamageToKeep:50
nanoFactorySpeed:10
energyMax:100
energyRegen:0.05
energyStartingPercentage:100
energyNeedsToRechargeToFull:true
