displayText:䗁T4
displayDescription:䗁之虫族的母虫\n进化后自身有了更强大的能力，可跨水\n可喷射范围性溶解液，对护盾双倍伤害；可发射范围性音波，无视装甲和护盾；有了近战能力；发射3束可以穿透2次的能量光束,每次伤害会衰减，无视装甲，穿透护盾\n全身覆盖装甲，获得巨大的提升
