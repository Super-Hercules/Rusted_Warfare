[hiddenAction_前进1]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if numberOfUnitsInEnemyTeam(withTag='单位',withinRange=290,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=155,greaterThan=0)
