addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:5000
[hiddenAction_前进2]
clearAllWaypoints:true
addWaypoint_type:attack
autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=280,greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='单位',withinRange=160,greaterThan=0) and not self.isAttacking and numberOfUnitsInEnemyTeam(withTag='单位',greaterThan=0)
