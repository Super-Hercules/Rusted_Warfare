[core]

class:CustomUnitMetadata
name:厄瑞的驱逐
tags:厄瑞的驱逐中介
displayText:厄瑞的驱逐
displayDescription:- 难度选择\n- 目前仅支持两个阵营对战，并且只能有一个ai
maxHp: 1
price: 1
mass: 1
radius: 42
displayRadius: 42
footprint:-1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0
isBuilding: true
isBuilder: true
isPickableStartingUnit: true
disableDeathOnZeroHp: true
autoTriggerCooldownTime: 1s
@memory 计时:number
updateUnitMemory: 计时=(memory.计时-1)
updateUnitMemoryRate: 1s
@memory 难度:number[]
[hiddenAction_计时]
autoTriggerOnEvent: created
price: 0
buildSpeed: 0
pos: 99
setUnitMemory: 计时=10, 难度[6]=0, 难度[7]=0
[action_投票计时]
isVisible: true
displayType: infoOnly
pos: 99
buildSpeed: 0
text:倒计时：%{memory.计时}s

[action_非常简单]
text:非常简单难度
description:- 适合单人，4k初始资金，1倍经济进行游玩\n- 帮助萌新初步理解单位
displayType: action
price: 0
buildSpeed: 0
pos: 1
showMessageToAllPlayers:%{self.playerName} 投 非常简单
addResources: 选1=1
temporarilyAddTags:完成
isLocked: if self.tags(includes='完成')
isLockedMessage: 你已经选择过了！
ai_isDisabled: true
[action_简单]
@copyFromSection:action_非常简单
text:简单难度
description:- 适合单人，4k初始资金，1倍经济进行游玩\n- 帮助玩家更好的掌握各种单位
showMessageToAllPlayers:%{self.playerName} 投 简单
addResources: 选2=1
[action_普通]
@copyFromSection:action_非常简单
text:普通难度
description:- 适合2-3人，4k初始资金，1倍经济进行游玩\n- 帮助玩家学会阵营间基本配合
showMessageToAllPlayers:%{self.playerName} 投 普通
addResources: 选3=1
[action_困难]
@copyFromSection:action_非常简单
text:困难难度
description:- 适合3-5人，10w初始资金，1倍经济进行游玩\n- 帮助玩家在高经济下学会布局与团队配合
showMessageToAllPlayers:%{self.playerName} 投 困难
addResources: 选4=1
[action_非常困难]
@copyFromSection:action_非常简单
text:非常困难难度
description:- 适合4-6人，20w初始资金，1倍经济进行游玩\n- 帮助玩家学会团队协作
showMessageToAllPlayers:%{self.playerName} 投 非常困难
addResources: 选5=1
[action_不可能]
@copyFromSection:action_非常简单
text:不可能难度
description:- 适合6-9人，20w初始资金，1倍经济进行游玩\n- 帮助玩家学会抗压
showMessageToAllPlayers:%{self.playerName} 投 不可能
addResources: 选6=1

[hiddenAction_选择1]
autoTrigger:if memory.计时==0
price: 0
buildSpeed: 1
pos: 99
setUnitMemory: 难度[0]=(self.resource.选1), 难度[1]=(self.resource.选2), 难度[2]=(self.resource.选3), 难度[3]=(self.resource.选4), 难度[4]=(self.resource.选5), 难度[5]=(self.resource.选6)
alsoTriggerAction: 选择2
alsoTriggerActionRepeat: memory.难度.size() - 1
[hiddenAction_选择2]
price: 0
buildSpeed: 0
pos: 99
requireConditional: if memory.难度[thisActionIndex] > memory.难度[6]
setUnitMemory: 难度[6] = memory.难度[thisActionIndex], 难度[7] = thisActionIndex

[hiddenAction_计时结束]
autoTrigger:if not self.isControlledByAI() and memory.计时==0
price: 0
buildSpeed: 0
pos: 99
sendMessageTo: self.attacking()
sendMessageWithTags: 难度
sendMessageWithData: 难度_i = memory.难度[7]
alsoQueueAction: 转非常简单玩家, 转简单玩家, 转普通玩家, 转困难玩家, 转非常困难玩家, 转不可能玩家
[hiddenAction_接收ai]
autoTriggerOnEvent: newMessage(withTag="难度")
setUnitMemory: 难度[7] = eventData("难度_i",type="number")

[hiddenAction_转非常简单玩家]
requireConditional:if memory.难度[7] == 0
price: 0
buildSpeed: 0
pos: 100
convertTo: 阵营选择
[hiddenAction_转简单玩家]
@copyFromSection: hiddenAction_转非常简单玩家
requireConditional:if memory.难度[7] == 1
[hiddenAction_转普通玩家]
@copyFromSection: hiddenAction_转非常简单玩家
requireConditional:if memory.难度[7] == 2
[hiddenAction_转困难玩家]
@copyFromSection: hiddenAction_转非常简单玩家
requireConditional:if memory.难度[7] == 3
[hiddenAction_转非常困难玩家]
@copyFromSection: hiddenAction_转非常简单玩家
requireConditional:if memory.难度[7] == 4
addResources: 196000
[hiddenAction_转不可能玩家]
@copyFromSection: hiddenAction_转非常简单玩家
requireConditional:if memory.难度[7] == 5

[hiddenAction_转难度中介]
autoTrigger:if self.isControlledByAI() and memory.计时<=0
price: 0
buildSpeed: 0
pos: 99
alsoQueueAction: 转非常简单, 转简单, 转普通, 转困难, 转非常困难, 转不可能
[hiddenAction_转非常简单]
requireConditional:if memory.难度[7] == 0
price: 0
buildSpeed: 0
pos: 100
convertTo: 非常简单
showMessageToAllPlayers: 当前难度为：非常简单
[hiddenAction_转简单]
@copyFromSection: hiddenAction_转非常简单
requireConditional:if memory.难度[7] == 1
convertTo: 简单
showMessageToAllPlayers:当前难度为：简单
[hiddenAction_转普通]
@copyFromSection: hiddenAction_转非常简单
requireConditional:if memory.难度[7] == 2
convertTo: 普通
showMessageToAllPlayers:当前难度为：普通
[hiddenAction_转困难]
@copyFromSection: hiddenAction_转非常简单
requireConditional:if memory.难度[7] == 3
convertTo: 困难
showMessageToAllPlayers:当前难度为：困难
[hiddenAction_转非常困难]
@copyFromSection: hiddenAction_转非常简单
requireConditional:if memory.难度[7] == 4
convertTo: 非常困难
showMessageToAllPlayers:当前难度为：非常困难
[hiddenAction_转不可能]
@copyFromSection: hiddenAction_转非常简单
requireConditional:if memory.难度[7] == 5
convertTo: 不可能
showMessageToAllPlayers:当前难度为：不可能


[graphics]
image: picker.png
scaleImagesTo: 60
showEnergyBar: false
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: true
maxAttackRange: 9999999
[turret_中介]
invisible: true
x: 0
y: 0
canShoot: false
[movement]
movementType: NONE