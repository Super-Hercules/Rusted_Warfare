[core]

name:联邦空中支援机
displayDescription:自动攻击敌方无能量时返回基地\n对敌方建筑造成大量伤害
tags:联邦空中支援机
class:CustomUnitMetadata
price:50000
maxHp:3200
mass:40000
buildSpeed:20s
availableInDemo:true
radius:10
energyMax:1
energyRegen:0
disableAllUnitCollisions:true
energyNeedsToRechargeToFull:true
isUnselectable:true
isBio:false
fogOfWarSightRange:30
autoTriggerCooldownTime:1s
transportSlotsNeeded:1
[hiddenAction_恢复]
autoTrigger:if self.hasParent(withTag='联邦空中支援基地')
addResources:energy=0.5
[hiddenAction_攻击]
autoTrigger:if self.energy(equalTo=1)
disconnectFromParent:true
convertTo:联邦空中支援机起飞
[hiddenAction_返航]
autoTrigger:if not self.hasActiveWaypoint(type='loadInto') and not self.hasParent() or self.energy(empty=true)
clearAllWaypoints:true
addWaypoint_type:loadInto
addWaypoint_target_nearestUnit_tagged:联邦空中支援基地
addWaypoint_target_nearestUnit_team:own
[graphics]
total_frames:1
imageScale:0.5
icon_zoomed_out:空天舰.png
image:UD_7.png
image_wreak:dUD_7.png
image_turret:NONE
image_shadow:AUTO
shadowOffsetX:4
shadowOffsetY:4
splastEffect:true
[attack]
canAttack:false
[movement]
movementType:AIR
moveSpeed:4
moveAccelerationSpeed:0.02
moveDecelerationSpeed:0.02
joinsGroupFormations:true
maxTurnSpeed:4
turnAcceleration:0.04
moveSlidingMode:false
moveIgnoringBody:false
moveSlidingDir:25
slowDeathFall:true