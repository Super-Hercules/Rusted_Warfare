[action_舰载机]
isLocked: if numberOfUnitsInTeam(greaterThan=51,withTag='和平鸽',factoryQueue=true)
produceUnits: 和平鸽*6
autoTrigger: if numberOfUnitsInTeam(lessThan=52,withTag='和平鸽',factoryQueue=true)
[hiddenAction_自动重建舰载机]
autoTrigger: if numberOfUnitsInTeam(lessThan=52,withTag='和平鸽',factoryQueue=true) and not self.hasFlag(id=0) and not self.hasFlag(id=1)
[hiddenAction_遇敌]
autoTrigger: if self.tags(includes='起飞') and numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyRemoveTags: 起飞
[hiddenAction_起飞]
autoTrigger: if not self.tags(includes='起飞') and not numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyAddTags: 起飞
