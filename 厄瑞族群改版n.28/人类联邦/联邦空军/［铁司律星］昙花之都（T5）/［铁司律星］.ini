[core]

name:昙彩之都
maxHp:1500000
mass:100000000
price:150000000
selfRegenRate:20
buildSpeed:180s
displayDescription:-“在已知历史中燃烧的永恒新星啊！携带诸花的星语，审判堕落的罪神！”\n“昙彩作为天工都类计划的产物，是除‘镇雷’外被赋予‘司律星’的第二位都级战舰\n-虽然‘昙彩’并没有装载护盾或者大型的防御装甲，但他却拥有极强的修复能力和关键部位的反应装甲，几乎能瞬间修复一段时间内的受损部位，这使得攻下这座堡垒几乎不可能\n-‘昙彩’搭载的六门七对的‘康乃馨’半天基炮，这使它能实现大范围的天基高频打击，‘尾部装载的‘罂粟’微核装置释放的腐蚀气体能蒸发护盾和护甲，且扩散极快\n-‘昙彩’外围搭载的范围火炮能有效清理敌方机群，其次中间搭载的散射火炮能瞬间造成密集攻击，内圈则搭载高频射速的机枪\n-‘昙彩’本体则拥有3门激光束\n-‘昙彩’最为强大的是他的载舰机能力，他表面能搭载42架铁卫载舰机，两侧的超长轨道则搭载52架和平鸽战机，在战斗中能大量制造鱼雷进行攻击\n-这是真正意义上的要塞\n-‘昙彩’是唯一一个用旧技术与雷都抗衡的武器，哪怕是雷都，在昙彩正面都会被击溃\n‘数以万计的灵魂将他托起，立起无法击溃的高塔，我等在此立下高判！’\n设计师：蜂后
radius:200
tags:铁都,昙彩之都
