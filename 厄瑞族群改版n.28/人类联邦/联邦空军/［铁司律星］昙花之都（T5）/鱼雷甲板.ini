produceUnits: 昙都鱼雷*6
autoTrigger: if numberOfUnitsInTeam(lessThan=12,withTag='鱼雷',factoryQueue=true)
[hiddenAction_自动重建舰载机]
autoTrigger: if numberOfUnitsInTeam(lessThan=12,withTag='鱼雷',factoryQueue=true) and not self.hasFlag(id=0) and not self.hasFlag(id=1)
[hiddenAction_鱼雷遇敌]
autoTrigger: if self.tags(includes='鱼雷起飞') and numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyRemoveTags: 鱼雷起飞
[hiddenAction_鱼雷起飞]
autoTrigger: if not self.tags(includes='鱼雷起飞') and not numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
temporarilyAddTags: 鱼雷起飞
[attack]
canAttack: false
[hiddenAction_死亡]
autoTrigger: if not self.hasUnitInTeam(withTag='铁都')
deleteSelf: true
