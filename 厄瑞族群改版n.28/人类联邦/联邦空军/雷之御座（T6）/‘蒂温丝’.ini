description:其雷引自之御座\n凝聚一枚雷蛇后蓄力一秒\n蓄力后将以极快的速度向自身前方直线投射\n命中敌人将造成一千范围的百分百穿盾伤害\n同时在目标地点造成一次数量为十的雷击\n随后产生十二处地点的二段爆炸\n在爆炸地点同时产生一次雷击和一枚小型雷矛进行直线攻击\n‘世人常说，雷电能驱散一切污秽\n但它本身却是一种污秽’
