[core]

name:雷之御座/‘蒂温丝’
displayDescription:雷鸣神之御座\n雷之御座是朝暮天翼最为成功的一项造物\n它的出现几乎是一亿里挑一之奇迹\n-雷之御座的设计凝聚了数个世纪的所有成果.\n-具备极强的持续作战能量\n它前舰装备了六门镭射机炮\n自身中心装备的四门雷剑激光炮能让其360度的无死角攻击\n-其中心的核心‘蒂温丝’水晶为他提供了无限的能量及动力.\n最为核心的是雷之御座具备了神明所赋予的王座权利\n这使它拥有超乎想象的防御能力，以及具备凝聚出无数的雷蛇进行攻击\n雷之御座：这将使其抵抗五次死亡致命\n-雷蛇之箭矢(随时凝聚一枚巨大的雷蛇用作攻击手段)\n-逆鳞龙铠(六十五的装甲值)，超重型质量旗舰(装甲具备免疫最低伤害)\n‘闪耀的雷蛇划开天空\n所有的无奈全都是背地的忏悔和痛苦！’
