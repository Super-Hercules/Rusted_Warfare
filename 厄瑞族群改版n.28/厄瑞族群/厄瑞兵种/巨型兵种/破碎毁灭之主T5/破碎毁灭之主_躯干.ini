[core]

copyFrom: 破碎毁灭之主_头.ini
name: 破碎毁灭之主_躯干
maxHp: 2000
armour: 30
armourMinDamageToKeep: 1
tags: 毁灭者
isUnselectable: true
canNotBeGivenOrdersByPlayer: true
isUnselectableAsTarget: false
showInEditor: false
ignoreInUnitCapCalculation: true
disableDeathOnZeroHp: true
[graphics]
image: 破碎毁灭之主.png
showHealthBar: false
showEnergyBar: false
[attack]
maxAttackRange: 70
meleeEngangementDistance: 0
[hiddenAction_计算节数]
alsoQueueAction: 链接身体
[hiddenAction_产生身体]
@copyFrom_skipThisSection: true
[hiddenAction_变成尾巴]
autoTriggerOnEvent: newMessage(withTag= 'a')
convertTo: 破碎毁灭之主_尾巴
setUnitMemory: 节数=0
[hiddenAction_链接身体]
autoTrigger: if distanceBetweenSquared(self, customTarget1)>25
addWaypoint_type: touchTarget
addWaypoint_target_fromReference: self.customTarget1
addWaypoint_target_nearestUnit_team: own
buildSpeed: 0
[hiddenAction_一起死亡]
autoTrigger: if self.customTarget2.hp<1 and self.timeAlive(laterThanSeconds=1) or self.customTarget1.hp<1
setResourcesWithLogic: energy=0
[hiddenAction_死亡笔记]
@copyFrom_skipThisSection: true
[hiddenAction_small]
autoTrigger: if self.hp(lessThan=2000)
[hiddenAction_中]
autoTrigger: if self.hp(lessThan=1989)
[hiddenAction_大]
autoTrigger: if self.hp(lessThan=1889)
[hiddenAction_巨]
autoTrigger: if self.hp(lessThan=889)
[movement]
moveSpeed: 4.3
moveAccelerationSpeed: 1
moveDecelerationSpeed: 0.4
moveIgnoringBody: true