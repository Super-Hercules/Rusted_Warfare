[core]

copyFrom: ROOT:/特殊/通用/机制模板/养分回收.template, ROOT:/特殊/通用/机制模板/战争指数机制.template, 巴尔公爵.ini
name:巴尔公爵(狂暴)
displayDescription:厄瑞族群的巨型陆军攻城兵种，范围伤害，对地，对护盾伤害效果不佳，T4级\n狂暴时装甲减半，能力值提升\n生命值高于一定值会转换形态\n击杀敌方单位可生产的巴尔仆从\n设计师:贰零拾月
[graphics]
image:汲取者(狂暴).png
[attack]
shootDelay:5
[action_转换]
autoTrigger:if self.hp(greaterThan=18000)
isLocked:true
isVisible:true
text:平静
description:如果血量低于18000，就会恢复平静
convertTo:巴尔公爵
[action_吸血]
isVisible:true
isLocked:true
text:吸血
iconImage:ROOT:/特殊/通用/加血.png
description:每次吸取1000点生命值
autoTrigger:if self.isAttacking()
addResources:hp=1000
[movement]
movementType:OVER_CLIFF_WATER
moveSpeed:5
maxTurnSpeed:1.5
moveSlidingDir:45