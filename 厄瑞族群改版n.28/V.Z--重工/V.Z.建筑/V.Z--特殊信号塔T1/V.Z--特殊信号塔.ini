[core]

name:V.Z--特殊信号塔
class:CustomUnitMetadata
maxHp:50000
mass:100
price: 5000
radius:50
buildSpeed:40s
isBuilding:true
displayDescription:可发送信息使传送队列迁跃而来\n可干扰天基定位\n设计师:V.Z(龙会自己上厕所吗)
footprint:-2,-2,2,2
constructionFootprint:-2,-2,2,2

[action_护盾]
isVisible:if not self.globalTeamTags(includes='护盾恢复') or self.isControlledByAI
isLocked:if not self.globalTeamTags(includes='信息T2')
description:解锁护盾恢复
allowMultipleInQueue:false
displayType:upgrade
price:500000
text:护盾恢复
buildSpeed:60s
pos: 5
addGlobalTeamTags:护盾恢复
[action_护盾恢复]
isVisible:if self.globalTeamTags(includes='护盾恢复')
isLocked:true
text:护盾恢复
description:己方每次护盾恢复增加7
autoTrigger:if self.globalTeamTags(includes='护盾恢复')
takeResources:shield=-7
takeResources_includeUnitsWithinRange:999999999
takeResources_includeUnitsWithinRange_team:own
takeResources_discardCollected:true
takeResources_keepResourcesOnTarget:false
takeResources_excludeUnitsWithoutAllResources:false
takeResources_maxUnits:9999999
isGuiBlinking:true
displayType:infoOnly
pos: 5
[action_生命]
isLocked:if not self.globalTeamTags(includes='信息T2')
isVisible:if not self.globalTeamTags(includes='生命恢复') or self.isControlledByAI
description:解锁生命恢复
allowMultipleInQueue:false
displayType:upgrade
price:500000
text:生命恢复
buildSpeed:60s
pos: 6
addGlobalTeamTags:生命恢复
iconImage:ROOT:/特殊/通用/加血.png
[action_生命恢复]
isVisible:if self.globalTeamTags(includes='生命恢复')
isLocked:true
text:生命恢复
description:己方每次生命恢复增加5
isGuiBlinking:true
displayType:infoOnly
autoTrigger:if self.globalTeamTags(includes='生命恢复')
takeResources:hp=-5
takeResources_includeUnitsWithinRange:999999999
takeResources_includeUnitsWithinRange_team:own
takeResources_discardCollected:true
takeResources_keepResourcesOnTarget:false
takeResources_excludeUnitsWithoutAllResources:false
takeResources_maxUnits:9999999
iconImage:ROOT:/特殊/通用/加血.png
pos: 6

[action_生命增长T2]
isVisible:if self.globalTeamTags(includes='信息T2') and not self.globalTeamTags(includes='升级T2')
price: 10000
buildSpeed: 60s
text:升级
description:- 提升70000最大生命值，增强自身配置的模块
setUnitStats: maxHp+=70000, hp+=70000
addGlobalTeamTags: 升级T2
pos: 10.1
[action_生命增长T3]
isVisible:if self.globalTeamTags(includes='信息T3') and self.globalTeamTags(includes='升级T2') and not self.globalTeamTags(includes='升级T3')
price:500000
buildSpeed:80s
text:升级
description:提升25000最大生命值，500攻击伤害，150攻击距离，并且增强自身配置的模块
addResources:hp=50000
addGlobalTeamTags:升级T3
pos: 10.2
setUnitStats:maxHp=50000,shootDamageMultiplier=4,maxAttackRange=600
[action_生命增长T4]
isVisible:if self.globalTeamTags(includes='信息T4') and self.globalTeamTags(includes='升级T3') and not self.globalTeamTags(includes='升级T4')
price:2500000
buildSpeed:100s
text:升级
description:提升50000最大生命值，1500攻击伤害，150攻击距离，并且增强自身配置的模块
addResources:hp=100000
addGlobalTeamTags:升级T4
pos: 10.3
setUnitStats:maxHp=100000,shootDamageMultiplier=10,maxAttackRange=750
[action_生命增长T5]
isVisible:if self.globalTeamTags(includes='信息T5') and self.globalTeamTags(includes='升级T4') and not self.globalTeamTags(includes='升级T5')
price:5000000
buildSpeed:120s
text:升级
description:提升50000最大生命值，2500攻击伤害，150攻击距离，并且增强自身配置的模块
addResources:hp=150000
addGlobalTeamTags:升级T5
pos: 10.4
setUnitStats:maxHp=150000,shootDamageMultiplier=20,maxAttackRange=900
[action_生命增长T6]
isVisible:if self.globalTeamTags(includes='信息T6') and self.globalTeamTags(includes='升级T5') and not self.globalTeamTags(includes='升级T6')
price:10000000
buildSpeed:140s
text:升级
description:提升100000最大生命值，5000攻击伤害，100攻击距离，并且增强自身配置的模块
addResources:hp=250000
addGlobalTeamTags:升级T6
pos: 10.5
setUnitStats:maxHp=250000,shootDamageMultiplier=40,maxAttackRange=1000
[action_生命增长完成]
isVisible:if self.globalTeamTags(includes='升级T6')
isActive:false
text:等级T6
description:单位等级已突破至T6单位
isGuiBlinking:true
displayType:infoOnly
pos: 10.6
[graphics]
image:V.Z--特殊信号塔.png
imageScale:1
total_frames:3
animation_idle_start:0
animation_idle_end:2
animation_idle_speed:20
[attack]
canAttack:false
[movement]
movementType:BUILDING