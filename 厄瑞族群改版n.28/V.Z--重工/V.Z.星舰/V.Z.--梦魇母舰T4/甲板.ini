produceUnits: V.Z--梦魇
autoTrigger: if numberOfUnitsInTeam(lessThan=8,withTag='梦魇',factoryQueue=true)
[hiddenAction_自动重建舰载机]
autoTrigger: if numberOfUnitsInTeam(lessThan=8,withTag='梦魇',factoryQueue=true) and not self.hasFlag(id=0) and not self.hasFlag(id=1)
[hiddenAction_遇敌]
autoTrigger: if self.tags(includes='起飞') and numberOfUnitsInEnemyTeam(greaterThan=0,withinRange=1000)
