[core]

name: V.Z--鱼雷舰(起飞)
class: CustomUnitMetadata
tags: 鱼雷
displayDescription: 设计师:V.Z(龙会自己上厕所吗)
price: 0
maxHp: 2000
mass: 400
techLevel: 1
buildSpeed: 0
selfRegenRate: 0.3
availableInDemo: true
radius: 20
fogOfWarSightRange: 30
disableAllUnitCollisions: true
energyMax: 100
energyRegen: 1
energyStartingPercentage: 100
energyNeedsToRechargeToFull: true
showInEditor:false
[graphics]
total_frames: 1
image: V.Z--鱼雷舰.png
image_shadow: AUTO
shadowOffsetX: 4
shadowOffsetY: 4
image_turret: 鱼雷.png
scaleTurretImagesTo: 25
[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: true
turretSize: 20
turretTurnSpeed: 1.5
maxAttackRange: 600
shootDelay: 0
attackMovement: bomber
isMelee: true
meleeEngangementDistance: 1000
[turret_plasmJ]
x: 0
y: -55
shoot_sound: large_gun_fire2
shoot_sound_vol: 0.8
shoot_flame: large
shoot_light: #ffc600
projectile: J
size: 25
recoilOffset: -1
energyUsage: 100
[projectile_J]
life: 800
speed: 5
drawSize: 1.4
trailEffect: true
largeHitEffect: true
frame: 1
directDamage: 500
lightColor: #ffff00
lightSize: 0.8
armourIgnoreAmount: 50
shieldDamageMultiplier: 5
[movement]
movementType: AIR
moveSpeed: 5
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.05
landOnGround: onlyIdle
reverseSpeedPercentage: 0
slowDeathFall: true
maxTurnSpeed: 8
turnAcceleration: 0.05
joinsGroupFormations: false
[hiddenAction_无影]
autoTrigger: if self.hasParent()
convertTo: V.Z--鱼雷舰
[hiddenAction_下层起飞]
autoTrigger: if not self.hasParent(withTag='起飞') and self.hasParent()
disconnectFromParent: true
[hiddenAction_巡航]
autoTrigger: if self.hasUnitInTeam(withTag='鱼雷甲板',withinRange=1000) and not self.hasActiveWaypoint(type='follow') and not self.hasParent()
clearAllWaypoints: true
addWaypoint_type: attackmove
addWaypoint_target_nearestUnit_tagged: 鱼雷甲板
addWaypoint_target_nearestUnit_team: own
[hiddenAction_返航]
autoTrigger: if not self.hasUnitInTeam(withTag='鱼雷甲板',withinRange=1000) and not self.hasActiveWaypoint(type='follow') and not self.hasParent()
clearAllWaypoints: true
addWaypoint_type: follow
addWaypoint_target_nearestUnit_tagged: 鱼雷甲板
addWaypoint_target_nearestUnit_team: own
addWaypoint_maxTime: 1s
[hiddenAction_脱离]
autoTrigger: if self.hasUnitInTeam(withTag='起飞') and not self.hasActiveWaypoint(type='loadInto') and not self.hasParent() or self.energy(empty=true)
clearAllWaypoints: true
addWaypoint_type: loadInto
addWaypoint_target_nearestUnit_tagged: 鱼雷甲板
addWaypoint_target_nearestUnit_team: own
[hiddenAction_死亡]
autoTrigger: if not self.hasUnitInTeam(withTag='鱼雷甲板')
addResources: hp=-99999999