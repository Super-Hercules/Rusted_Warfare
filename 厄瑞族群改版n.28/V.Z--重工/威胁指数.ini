[core]

name: 威胁指数
class: CustomUnitMetadata
isUnselectable: true
disableAllUnitCollisions: true
canNotBeDirectlyAttacked: true
canNotBeDamaged: true
disableDeathOnZeroHp: true
ignoreInUnitCapCalculation: true
isUnrepairableUnit: true
showInEditor: false
showOnMinimap: false
showOnMinimapToEnemies: false
maxHp: 9999999
mass: 100
price: 0
radius: 5
fogOfWarSightRange: 0
[graphics]
image: ROOT:/特殊/通用/空白.png
scaleImagesTo: 1
[attack]
canAttack: false
[movement]
movementType: NONE
[action_AI加强]
isVisible: false
autoTrigger: if self.isControlledByAI() and not self.globalTeamTags(includes='无额外')
addResources: credits= 0
[hiddenAction_威胁等级T2提升]
autoTrigger: if self.resource(type='威胁指数', greaterThan=7500)
temporarilyAddTags: 威胁T2
[hiddenAction_威胁等级T2下降]
autoTrigger: if self.resource(type='威胁指数', lessThan=7500)
temporarilyRemoveTags: 威胁T2
