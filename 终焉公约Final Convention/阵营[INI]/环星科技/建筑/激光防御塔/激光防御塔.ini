y: 31
canShoot: false
laserDefenceEnergyUse: 1.1
size: 0
[action_加固]
text: 加固
description: - 大幅改善结构，增加血量\n- 扩充能量槽，增加一倍能量
price: 10000
buildSpeed: 15s
setUnitStats: maxHp+=5000, hp+=5000, maxEnergy+=10
[movement]
