displayDescription: - 可以拦截部分单位的攻击
class: CustomUnitMetadata
price: 3000
maxHp: 3000
mass: 9999
footprint: 0, 0, 1, 1
constructionFootprint: 0, 0, 1, 1
buildingToFootprintOffsetX: 20
buildingToFootprintOffsetY: 20
techLevel: 1
buildSpeed: 60s
radius: 40
isBio: false
isBuilding: true
energyMax: 10
